<h1>本机双语字幕</h1>
<p>在支持的 Prime Video 网页中，将片源已有的英语或日语文字字幕用浏览器本机模型翻译为简体中文。扩展默认自动识别原字幕语言，也可以在播放器左侧菜单中手动切换。</p>
